<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara AI - Premium Legal Tech & AI Resources</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Meta/Facebook JavaScript SDK -->
<div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0"></script>

<div class="container">
    <header>
        <h1>Sara AI</h1>
        <p>Orchestrating Legal Technology & AI Governance</p>
    </header>

    <main>
        <div class="card">
            <div class="badge">Exclusive Access</div>
            <h3>Download AI Legal-Tech Framework</h3>
            <p class="description">Get the official orchestration logic, prompt frameworks, and no-code building blueprints used by our team.</p>
            
            <!-- Optimized Facebook Follow Box -->
            <div class="follow-box">
                <p class="follow-prompt">Step 1: Join the <strong>Sara AI Team</strong> community to stay updated:</p>
                
                <!-- NOTE: Replace the URL below with your actual Sara AI Facebook page link once live -->
                <div class="fb-page" 
                    data-href="https://www.facebook.com/facebook" 
                    data-tabs="timeline" 
                    data-small-header="false" 
                    data-adapt-container-width="true" 
                    data-hide-cover="false" 
                    data-show-facepile="true">
                    <blockquote cite="https://www.facebook.com/facebook" class="fb-xfbml-parse-ignore">
                        <a href="https://www.facebook.com/facebook">Sara AI Team</a>
                    </blockquote>
                </div>
            </div>

            <!-- Soft-Gate Action Button -->
            <button class="btn-main" onclick="alert('Thank you! The framework download link has been unlocked. Make sure you are following the page for daily updates!')">
                Access Framework Now
            </button>
        </div>
    </main>
</div>

</body>
</html>
