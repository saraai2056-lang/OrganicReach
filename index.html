<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Sara AI — Organic Growth Tool</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    /* Integrated CSS - No separate file needed */
    body { background: #030D07; font-family: 'Outfit', sans-serif; color: #e0f0e8; margin: 0; overflow-x: hidden; }
    .page { padding: 40px 16px; max-width: 450px; margin: 0 auto; }
    
    .card { 
        background: rgba(8, 24, 14, 0.95); 
        border: 1px solid rgba(0, 217, 120, 0.2); 
        border-radius: 18px; 
        padding: 24px; 
        margin-bottom: 20px; 
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 32px; color: #fff; margin: 0; }
    h1 span { color: #00D97E; }
    
    .btn-primary { 
        background: linear-gradient(135deg, #00D97E, #00A85E); 
        border: none; border-radius: 12px; padding: 14px; 
        color: #000; font-weight: 700; width: 100%; 
        cursor: pointer; font-family: 'Syne', sans-serif; 
        margin-top: 15px;
    }

    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .tool-item { 
        background: rgba(255,255,255,0.03); 
        border: 1px solid rgba(0,217,120,0.1); 
        padding: 15px; border-radius: 12px; font-size: 13px; 
        cursor: pointer;
    }
    .tool-item:hover { border-color: #00D97E; }
    
    .badge { background: rgba(0, 217, 120, 0.1); color: #00D97E; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  function App() {
    const [view, setView] = useState('home');

    const HomePage = () => (
      <div className="page">
        <div className="card">
          <span className="badge">SARA AI TEAM</span>
          <h1>Sara<span>AI</span></h1>
          <p style={{color:'#7ab893', fontSize:'14px', marginTop:'8px'}}>Free Organic Growth Tools</p>
          
          <div className="tool-grid">
            <div className="tool-item" onClick={() => setView('tips')}>📈 Growth Tips</div>
            <div className="tool-item" onClick={() => setView('hash')}>🏷️ Hashtags</div>
            <div className="tool-item" onClick={() => setView('ideas')}>💡 Post Ideas</div>
            <div className="tool-item" onClick={() => setView('fb')}>👤 Follow Us</div>
          </div>
        </div>
      </div>
    );

    const TipsPage = () => (
      <div className="page">
        <div className="card">
          <h3>Growth Tips</h3>
          <p style={{fontSize:'14px', textAlign:'left'}}>1. Post videos instead of images.<br/>2. Reply to comments in 1 hour.<br/>3. Use 3-5 niche hashtags.</p>
          <button className="btn-primary" onClick={() => setView('home')}>Back Home</button>
        </div>
      </div>
    );

    const FacebookPage = () => (
      <div className="page">
        <div className="card">
          <h3>Join the Community</h3>
          <p>Follow our official Facebook page for daily AI framework updates.</p>
          <button className="btn-primary" onClick={() => window.open('https://www.facebook.com/YOUR_PAGE_HERE', '_blank')}>
            Open Facebook Page
          </button>
          <button style={{background:'none', border:'none', color:'#5a8a6a', marginTop:'15px', cursor:'pointer'}} onClick={() => setView('home')}>
            Return to Tools
          </button>
        </div>
      </div>
    );

    if (view === 'tips') return <TipsPage />;
    if (view === 'fb') return <FacebookPage />;
    return <HomePage />;
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>
