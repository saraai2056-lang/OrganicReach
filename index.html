<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Sara AI — Organic Growth Tool</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    body { background: #030D07; font-family: 'Outfit', sans-serif; color: #e0f0e8; margin: 0; overflow-x: hidden; }
    .page { padding: 40px 16px; max-width: 450px; margin: 0 auto; min-height: 90vh; display: flex; flex-direction: column; justify-content: center; }
    
    .card { 
        background: rgba(8, 24, 14, 0.95); 
        border: 1px solid rgba(0, 217, 120, 0.2); 
        border-radius: 18px; 
        padding: 30px; 
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,217,120,0.1);
    }

    h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 36px; color: #fff; margin: 0; }
    h1 span { color: #00D97E; }
    
    .btn-primary { 
        background: linear-gradient(135deg, #00D97E, #00A85E); 
        border: none; border-radius: 12px; padding: 16px; 
        color: #000; font-weight: 700; width: 100%; 
        cursor: pointer; font-family: 'Syne', sans-serif; 
        margin-top: 20px; font-size: 16px;
    }

    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
    .tool-item { 
        background: rgba(255,255,255,0.03); 
        border: 1px solid rgba(0,217,120,0.1); 
        padding: 15px; border-radius: 12px; font-size: 13px; 
        cursor: pointer; transition: 0.3s;
    }
    .tool-item:hover { border-color: #00D97E; background: rgba(0,217,120,0.05); }
    
    .badge { background: rgba(0, 217, 120, 0.1); color: #00D97E; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    
    .team-box { margin-top: 20px; font-size: 12px; color: #7ab893; border-top: 1px solid rgba(0,217,120,0.1); paddingTop: 15px; }
    .bot-names { color: #00D97E; font-weight: 600; letter-spacing: 1px; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState } = React;

  function App() {
    const [view, setView] = useState('home');

    const HomePage = () => (
      <div className="page fade-up">
        <div className="card">
          <span className="badge">OFFICIAL PORTAL</span>
          <h1>Sara<span>AI</span></h1>
          <p style={{color:'#7ab893', fontSize:'15px', marginTop:'8px'}}>Organic Growth & Legal Tech</p>
          
          <div className="tool-grid">
            <div className="tool-item" onClick={() => setView('tips')}>📈 Growth Tips</div>
            <div className="tool-item" onClick={() => setView('hash')}>🏷️ Hashtags</div>
            <div className="tool-item" onClick={() => setView('ideas')}>💡 Post Ideas</div>
            <div className="tool-item" onClick={() => setView('fb')}>👤 Follow Us</div>
          </div>

          <div className="team-box">
            Managed by <span className="bot-names">ATLAS • NOVA • SAGE</span>
          </div>
        </div>
      </div>
    );

    const TipsPage = () => (
      <div className="page">
        <div className="card">
          <h3 style={{color: '#00D97E'}}>Organic Growth Tips</h3>
          <ul style={{textAlign:'left', fontSize:'14px', lineHeight:'1.8', color:'#b0d8c0'}}>
            <li>Post 3-5 times weekly for consistency.</li>
            <li>Reply to all comments within 60 minutes.</li>
            <li>Use 3 niche hashtags to avoid spam filters.</li>
            <li>Facebook Live boosts reach by 6x.</li>
          </ul>
          <button className="btn-primary" onClick={() => setView('home')}>Back to Tools</button>
        </div>
      </div>
    );

    const FacebookPage = () => (
      <div className="page">
        <div className="card">
          <div style={{fontSize:'40px', marginBottom:'15px'}}>🌱</div>
          <h3>Join the Community</h3>
          <p style={{fontSize:'14px', color:'#7ab893'}}>To unlock the AI Legal-Tech Framework, join our official page.</p>
          
          <button className="btn-primary" onClick={() => window.open('https://www.facebook.com/share/1Kvrsu4koH/', '_blank')}>
            Follow Sara AI Page
          </button>
          
          <button style={{background:'none', border:'none', color:'#5a8a6a', marginTop:'20px', cursor:'pointer', fontSize:'13px'}} onClick={() => setView('home')}>
            ← Return to Dashboard
          </button>
        </div>
      </div>
    );

    if (view === 'tips') return <TipsPage />;
    if (view === 'fb') return <FacebookPage />;
    return <HomePage />;
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

</body>
</html>
