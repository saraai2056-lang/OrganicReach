<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara AI — Organic Growth Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #030D07;
            color: #e0f0e8;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(8, 24, 14, 0.95);
            border: 1px solid rgba(0, 217, 120, 0.3);
            border-radius: 24px;
            padding: 40px 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 217, 120, 0.15);
        }

        .badge {
            background: rgba(0, 217, 120, 0.1);
            color: #00D97E;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: inline-block;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            margin: 0;
            color: #fff;
        }

        h1 span { color: #00D97E; }

        .subtitle {
            color: #7ab893;
            font-size: 15px;
            margin: 10px 0 30px 0;
            line-height: 1.5;
        }

        .btn-main {
            background: linear-gradient(135deg, #00D97E, #00A85E);
            color: #000;
            text-decoration: none;
            display: block;
            padding: 18px;
            border-radius: 14px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            margin-bottom: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 217, 120, 0.3);
        }

        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .tool {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 217, 120, 0.1);
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            color: #b0d8c0;
        }

        .footer-team {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 11px;
            color: #5a8a6a;
        }

        .bots {
            color: #00D97E;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">OFFICIAL ACCESS</div>
        <h1>Sara<span>AI</span></h1>
        <p class="subtitle">Orchestrating Legal Innovation &<br>Organic Growth Strategies</p>

        <a href="https://www.facebook.com/saraai2056" target="_blank" class="btn-main">
            FOLLOW @saraai2056
        </a>

        <div class="tool-grid">
            <div class="tool">📈 Growth Tips</div>
            <div class="tool">🏷️ Viral Tags</div>
            <div class="tool">💡 Post Ideas</div>
            <div class="tool">📊 Reach Calc</div>
        </div>

        <div class="footer-team">
            Powered by the Sara AI Team
            <span class="bots">Atlas • Nova • Sage</span>
        </div>
    </div>

</body>
</html>
