<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara AI | Global Growth Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00D97E; --dark: #030D07; }
        body { background: var(--dark); color: #e0f0e8; font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; }
        
        .card {
            background: rgba(8, 24, 14, 0.98);
            border: 1px solid rgba(0, 217, 120, 0.3);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 217, 120, 0.15);
        }

        .badge { background: rgba(0, 217, 120, 0.1); color: var(--neon); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        h1 { font-family: 'Syne', sans-serif; font-size: 38px; margin: 0; color: #fff; }
        h1 span { color: var(--neon); }

        /* REGION SELECTOR (New) */
        .region-selector { display: none; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .region-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .region-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,217,120,0.05); }

        /* DISPLAY AREA */
        #display-area {
            margin: 15px 0;
            min-height: 180px;
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            padding: 20px;
            border: 1px dashed rgba(0, 217, 120, 0.2);
            text-align: left;
        }

        .locked-msg { text-align: center; color: #7ab893; padding-top: 40px; }
        .result-title { color: var(--neon); font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; }
        .result-text { font-size: 13px; line-height: 1.6; color: #fff; white-space: pre-line; }

        .btn-action {
            background: linear-gradient(135deg, #00D97E, #00A85E);
            color: #000;
            text-decoration: none;
            display: block;
            padding: 18px;
            border-radius: 15px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .tool-nav { display: none; gap: 8px; margin-bottom: 10px; }
        .nav-btn { background: rgba(0,217,120,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 10px; border-radius: 12px; font-size: 11px; cursor: pointer; flex: 1; font-weight: 600; }

        .footer-team { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; font-size: 11px; color: #5a8a6a; }
        .bots { color: var(--neon); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <span class="badge" id="main-badge">GLOBAL LEGAL-TECH NODE</span>
            <h1>Sara<span>AI</span></h1>
            
            <div class="region-selector" id="region-bar">
                <button class="region-btn active" onclick="setRegion('UK')">🇬🇧 UK</button>
                <button class="region-btn" onclick="setRegion('USA')">🇺🇸 USA</button>
                <button class="region-btn" onclick="setRegion('IND')">🇮🇳 India</button>
            </div>

            <div id="display-area">
                <div id="content-screen" class="locked-msg">
                    <div style="font-size: 30px; margin-bottom: 10px;">🌎</div>
                    <strong>Atlas:</strong> Regional Data Encrypted.<br>
                    Follow to unlock international growth nodes.
                </div>
            </div>

            <div class="tool-nav" id="nav">
                <button class="nav-btn" onclick="showTags()">Viral Tags</button>
                <button class="nav-btn" onclick="showStrategy()">Market Strategy</button>
            </div>

            <button id="main-btn" class="btn-action" onclick="unlockTool()">
                UNLOCK GLOBAL DASHBOARD
            </button>

            <div class="footer-team">
                Orchestrated by the Sara AI Team
                <span class="bots">Atlas • Nova • Sage</span>
            </div>
        </div>
    </div>

    <script>
        let currentRegion = 'UK';
        const data = {
            UK: {
                tags: "#UKLaw #LondonLawyers #SolicitorsOfUK #LegalTechUK #SaraAI #UKBusiness #LawInLondon",
                strategy: "• Peak Posting: 8:00 AM & 5:00 PM GMT.\n• Focus: GDPR Compliance & AI Regulation updates.\n• Engagement: Tag UK Law Societies."
            },
            USA: {
                tags: "#USLaw #AttorneyLife #LegalInnovation #AmericanBar #LegalTechUSA #LawFirmGrowth",
                strategy: "• Peak Posting: 12:00 PM EST (Lunch Break).\n• Focus: Efficiency & Billable Hours AI solutions.\n• Engagement: Use 'Thought Leadership' LinkedIn-style tone."
            },
            IND: {
                tags: "#IndianLawyers #SupremeCourtIndia #LegalTechIndia #LawStudentsIndia #DigitalIndia #LegalInnovation",
                strategy: "• Peak Posting: 10:00 AM & 9:00 PM IST.\n• Focus: Court Digitization & Accessibility.\n• Engagement: Respond to legal queries in comments."
            }
        };

        function unlockTool() {
            window.open('https://www.facebook.com/saraai2056', '_blank');
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('region-bar').style.display = 'flex';
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('main-badge').innerHTML = "STATUS: GLOBAL NODE ACTIVE";
            showStrategy();
        }

        function setRegion(reg) {
            currentRegion = reg;
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            showStrategy(); // Update view
        }

        function showTags() {
            render(`${currentRegion} Viral Tags`, data[currentRegion].tags);
        }

        function showStrategy() {
            render(`${currentRegion} Market Strategy`, data[currentRegion].strategy);
        }

        function render(title, text) {
            const screen = document.getElementById('content-screen');
            screen.classList.remove('locked-msg');
            screen.innerHTML = `<span class="result-title">${title}</span><div class="result-text">${text}</div>`;
        }
    </script>
</body>
</html>
