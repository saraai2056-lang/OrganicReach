<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara AI | Utility Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00D97E; --dark: #030D07; }
        body { background: var(--dark); color: #e0f0e8; font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; }
        
        .card {
            background: rgba(8, 24, 14, 0.98);
            border: 1px solid rgba(0, 217, 120, 0.3);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 217, 120, 0.15);
        }

        .badge { background: rgba(0, 217, 120, 0.1); color: var(--neon); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        h1 { font-family: 'Syne', sans-serif; font-size: 38px; margin: 0; color: #fff; }
        h1 span { color: var(--neon); }

        /* THE UTILITY AREA */
        #display-area {
            margin: 25px 0;
            min-height: 200px;
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            padding: 20px;
            border: 1px dashed rgba(0, 217, 120, 0.2);
            text-align: left;
        }

        .locked-msg { text-align: center; color: #7ab893; padding-top: 40px; }
        
        .result-title { color: var(--neon); font-weight: bold; font-size: 14px; margin-bottom: 10px; display: block; }
        .result-text { font-size: 13px; line-height: 1.6; color: #fff; }
        .copy-hint { font-size: 10px; color: #5a8a6a; margin-top: 10px; display: block; }

        .btn-action {
            background: linear-gradient(135deg, #00D97E, #00A85E);
            color: #000;
            text-decoration: none;
            display: block;
            padding: 18px;
            border-radius: 15px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        .tool-nav { display: flex; gap: 8px; margin-bottom: 15px; display: none; }
        .nav-btn { background: rgba(0,217,120,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 8px 12px; border-radius: 10px; font-size: 11px; cursor: pointer; flex: 1; }

        .footer-team { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; font-size: 11px; color: #5a8a6a; }
        .bots { color: var(--neon); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <span class="badge" id="main-badge">SARA AI: SECURE NODE</span>
            <h1>Sara<span>AI</span></h1>
            
            <div id="display-area">
                <div id="content-screen" class="locked-msg">
                    <div style="font-size: 30px; margin-bottom: 10px;">🔒</div>
                    <strong>Atlas:</strong> Data Encrypted.<br>
                    Follow the page to receive the 2026 Growth Prompt.
                </div>
            </div>

            <div class="tool-nav" id="nav">
                <button class="nav-btn" onclick="showTags()">Viral Tags</button>
                <button class="nav-btn" onclick="showHook()">Video Hook</button>
                <button class="nav-btn" onclick="showStrategy()">Strategy</button>
            </div>

            <button id="main-btn" class="btn-action" onclick="unlockTool()">
                FOLLOW TO UNLOCK UTILITY
            </button>

            <div class="footer-team">
                Verified by the Sara AI Team
                <span class="bots">Atlas • Nova • Sage</span>
            </div>
        </div>
    </div>

    <script>
        function unlockTool() {
            window.open('https://www.facebook.com/saraai2056', '_blank');
            
            // UI Transformation
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('main-badge').innerHTML = "SYSTEM: ONLINE";
            showStrategy();
        }

        function showTags() {
            render("Viral Tag Set", "#LawTech #LegalAI #SaraAI #OrganicGrowth2026 #FutureOfLaw #PakistanLawyers");
        }

        function showHook() {
            render("AI Video Hook Script", "Nova recommends: 'Did you know 90% of lawyers waste 5 hours a week on research? Here is the AI prompt that solves it...' (Use this script for Reels)");
        }

        function showStrategy() {
            render("Sage's Growth Logic", "1. Post at 11:00 AM PKT.<br>2. Use the 'Hook-Value-CTA' structure.<br>3. Engage with 5 similar pages before you post.");
        }

        function render(title, text) {
            const screen = document.getElementById('content-screen');
            screen.classList.remove('locked-msg');
            screen.innerHTML = `<span class="result-title">${title}</span><div class="result-text">${text}</div><span class="copy-hint">Copy this data to your Facebook Creator Studio.</span>`;
        }
    </script>
</body>
</html>
