<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara AI | Global Strategy Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00D97E; --dark: #030D07; }
        body { background: var(--dark); color: #e0f0e8; font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; }
        
        .card {
            background: rgba(8, 24, 14, 0.98);
            border: 1px solid rgba(0, 217, 120, 0.3);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 217, 120, 0.15);
        }

        .badge { background: rgba(0, 217, 120, 0.1); color: var(--neon); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: inline-block; border: 1px solid rgba(0,217,120,0.2); }
        h1 { font-family: 'Syne', sans-serif; font-size: 38px; margin: 0; color: #fff; }
        h1 span { color: var(--neon); }

        .region-selector { display: none; gap: 6px; margin: 20px 0; justify-content: center; flex-wrap: wrap; }
        .region-btn { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .region-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,217,120,0.1); }

        #display-area {
            margin: 15px 0;
            min-height: 220px;
            background: rgba(255,255,255,0.02);
            border-radius: 22px;
            padding: 25px;
            border: 1px dashed rgba(0, 217, 120, 0.2);
            text-align: left;
        }

        .locked-msg { text-align: center; color: #7ab893; padding-top: 50px; }
        .result-title { color: var(--neon); font-weight: bold; font-size: 14px; margin-bottom: 12px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        .result-text { font-size: 13px; line-height: 1.7; color: #fff; white-space: pre-line; }

        .btn-action {
            background: linear-gradient(135deg, #00D97E, #00A85E);
            color: #000;
            text-decoration: none;
            display: block;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            font-family: 'Syne', sans-serif;
            border: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 217, 120, 0.3);
        }

        .tool-nav { display: none; gap: 10px; margin-top: 15px; }
        .nav-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,217,120,0.3); color: #fff; padding: 12px; border-radius: 12px; font-size: 11px; cursor: pointer; flex: 1; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover { background: var(--neon); color: #000; }

        .footer-team { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; font-size: 11px; color: #5a8a6a; }
        .bots { color: var(--neon); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <span class="badge" id="main-badge">SARA AI: MULTI-NODE ACTIVE</span>
            <h1>Sara<span>AI</span></h1>
            
            <div class="region-selector" id="region-bar">
                <button class="region-btn active" onclick="setRegion('UK')">🇬🇧 UK</button>
                <button class="region-btn" onclick="setRegion('USA')">🇺🇸 USA</button>
                <button class="region-btn" onclick="setRegion('IND')">🇮🇳 India</button>
                <button class="region-btn" onclick="setRegion('PK')">🇵🇰 Pakistan</button>
            </div>

            <div id="display-area">
                <div id="content-screen" class="locked-msg">
                    <div style="font-size: 35px; margin-bottom: 15px;">📡</div>
                    <strong>Atlas:</strong> Connection Pending.<br>
                    Follow to synchronize global growth data.
                </div>
            </div>

            <div class="tool-nav" id="nav">
                <button class="nav-btn" onclick="showTags()">Viral Tags</button>
                <button class="nav-btn" onclick="showStrategy()">Growth Tips</button>
            </div>

            <button id="main-btn" class="btn-action" onclick="unlockTool()">
                SYNC WITH SARA AI TEAM
            </button>

            <div class="footer-team">
                Orchestrated by the Sara AI Team
                <span class="bots">Atlas • Nova • Sage</span>
            </div>
        </div>
    </div>

    <script>
        let currentRegion = 'UK';
        const data = {
            UK: {
                tags: "#UKLaw #LondonSolicitors #LegalTechUK #SaraAI #LawFirmGrowth #LondonBusiness",
                strategy: "• Peak Time: 08:30 GMT (Morning Commute).\n• Tip: Use 'LinkedIn-style' professional storytelling.\n• Focus: AI Regulations & GDPR updates."
            },
            USA: {
                tags: "#USLawyer #AttorneyMarketing #LegalInnovation #LawFirmMarketing #AIforLawyers #AmericanBar",
                strategy: "• Peak Time: 11:30 EST.\n• Tip: Focus on 'Efficiency' and 'Billable Hours' solutions.\n• Focus: Practical AI tools for small firms."
            },
            IND: {
                tags: "#IndianLaw #SupremeCourtIndia #LegalTechIndia #DigitalIndia #LawyerLifeIndia #SaraAIIndia",
                strategy: "• Peak Time: 10:15 IST & 20:30 IST.\n• Tip: Educational content for young lawyers/students works best.\n• Focus: Judicial digitization & case-law summaries."
            },
            PK: {
                tags: "#PakistanLaw #LahoreHighCourt #IslamabadLawyers #LegalTechPakistan #SaraAIPK #LawyersOfPakistan",
                strategy: "• Peak Time: 11:00 AM & 9:00 PM PKT.\n• Tip: Visual evidence and Urdu/English mixed content (Roman Urdu) gets 3x more reach.\n• Focus: High Court updates and AI research tools."
            }
        };

        function unlockTool() {
            window.open('https://www.facebook.com/saraai2056', '_blank');
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('region-bar').style.display = 'flex';
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('main-badge').innerHTML = "SYSTEM STATUS: ONLINE";
            showStrategy();
        }

        function setRegion(reg) {
            currentRegion = reg;
            document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            showStrategy(); 
        }

        function showTags() {
            render(`${currentRegion} Viral Tags`, data[currentRegion].tags);
        }

        function showStrategy() {
            render(`${currentRegion} Growing Strategy`, data[currentRegion].strategy);
        }

        function render(title, text) {
            const screen = document.getElementById('content-screen');
            screen.classList.remove('locked-msg');
            screen.innerHTML = `<span class="result-title">${title}</span><div class="result-text">${text}</div>`;
        }
    </script>
</body>
</html>
