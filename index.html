<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>OrganicReach — Free Facebook Growth Tool</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;overflow-x:hidden;}
    body{background:#030D07;font-family:'Outfit',sans-serif;color:#e0f0e8;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:#1a3a2a;border-radius:10px;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}

    .fade-up{animation:fadeUp 0.4s ease both;}
    .card{background:rgba(8,24,14,0.95);border:1px solid rgba(0,217,120,0.12);border-radius:18px;padding:20px;margin-bottom:14px;}
    .card:hover{border-color:rgba(0,217,120,0.25);}

    .top-nav{position:fixed;top:0;left:0;right:0;z-index:100;height:62px;background:rgba(3,13,7,0.97);border-bottom:1px solid rgba(0,217,120,0.15);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 16px;gap:10px;}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(3,13,7,0.97);border-top:1px solid rgba(0,217,120,0.15);display:flex;padding:10px 0 16px;}
    .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;color:#3a6a4a;cursor:pointer;font-size:10px;font-family:'Outfit',sans-serif;font-weight:500;transition:color 0.15s;}
    .bottom-nav button.active{color:#00D97E;}
    .bottom-nav button .ni{font-size:22px;}

    .page{padding:70px 14px 86px;max-width:100%;}

    .btn-primary{background:linear-gradient(135deg,#00D97E,#00A85E);border:none;border-radius:12px;padding:13px 24px;color:#000;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;font-size:15px;transition:all 0.2s;width:100%;}
    .btn-primary:active{opacity:0.85;}
    .btn-primary:disabled{opacity:0.4;cursor:default;}

    .input-field{width:100%;background:rgba(0,217,120,0.04);border:1px solid rgba(0,217,120,0.15);border-radius:12px;padding:13px 15px;color:#d0f0e0;font-family:'Outfit',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
    .input-field:focus{border-color:rgba(0,217,120,0.45);}
    .input-field::placeholder{color:#3a6a4a;}

    select.input-field{-webkit-appearance:none;appearance:none;}

    .tag{background:rgba(0,217,120,0.1);border:1px solid rgba(0,217,120,0.25);color:#00D97E;border-radius:20px;padding:5px 13px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;display:inline-block;}

    .result-box{background:rgba(0,217,120,0.05);border:1px solid rgba(0,217,120,0.2);border-radius:14px;padding:16px;margin-top:14px;}

    .score-bar-bg{background:rgba(0,217,120,0.1);border-radius:8px;height:10px;overflow:hidden;margin-top:6px;}
    .score-bar{background:linear-gradient(90deg,#00D97E,#00FFB3);height:10px;border-radius:8px;transition:width 1s ease;}

    .spinner{width:22px;height:22px;border:3px solid rgba(0,217,120,0.2);border-top-color:#00D97E;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;}

    .tip-card{background:rgba(0,217,120,0.05);border-left:3px solid #00D97E;border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;}

    .section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;color:#e0f0e8;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

    .time-slot{background:rgba(0,217,120,0.07);border:1px solid rgba(0,217,120,0.15);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
    .time-slot.best{border-color:#00D97E;background:rgba(0,217,120,0.15);}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

    "Business & Finance":["#BusinessTips","#Entrepreneur","#SmallBusiness","#FinanceTips","#MindsetMatters","#SuccessMindset","#BusinessGrowth","#MoneyTips","#StartupLife","#BusinessOwner","#PassiveIncome","#InvestSmart","#WealthBuilding","#DigitalMarketing","#BusinessStrategy"],
    "Technology":["#TechTips","#Innovation","#FutureTech","#TechNews","#CodingLife","#AITechnology","#DigitalTransformation","#TechCommunity","#Programming","#SoftwareDev","#TechStartup","#MachineLearning","#TechForGood","#DevLife","#TechTrends"],
    "Travel":["#TravelBlogger","#Wanderlust","#TravelPhotography","#ExploreMore","#TravelLife","#AdventureTime","#TravelInspiration","#HiddenGems","#TravelDiaries","#BucketList","#TravelTips","#SoloTravel","#NatureLovers","#TravelWithMe","#WorldTravel"],
    "Education":["#LearningEveryDay","#EduTech","#StudyTips","#KnowledgeIsPower","#OnlineLearning","#TeacherLife","#EducationMatters","#StudyMotivation","#LifelongLearner","#StudyWithMe","#LearnMore","#EduCommunity","#SkillBuilding","#CareerGrowth","#MindGrowth"],
    "Entertainment":["#Entertainment","#MovieNight","#MustWatch","#NetflixAndChill","#PopCulture","#FunContent","#Trending","#Viral","#MustSee","#WeekendVibes","#FunnyMoments","#ContentCreator","#VideoContent","#Reels","#GoodVibesOnly"],

    "E-commerce":["#OnlineShopping","#ShopOnline","#Ecommerce","#ShopSmall","#BuyLocal","#OnlineStore","#ProductLaunch","#ShopNow","#NewArrivals","#FlashSale","#SaleAlert","#ShopLocal","#MustHave","#OnlineBusiness","#ShopWithMe"],
  };

  const DEFAULT_HASHTAGS = ["#SocialMedia","#GrowthHacking","#ContentMarketing","#DigitalMarketing","#Trending","#ViralContent","#EngagementBoost","#OrganicGrowth","#OnlineMarketing","#ContentStrategy","#SocialMediaTips","#ReachMore","#BuildYourBrand","#AudienceGrowth","#FreeMarketing"];

  const POST_IDEAS = {
    "Food & Restaurant":["Share a behind-the-scenes kitchen video 🍳","Post a before and after dish transformation","Ask followers: spicy or mild? 🌶️","Share your most popular recipe step by step","Post a customer review with their photo","Show your fresh ingredients every morning","Create a poll: which dish should we add?","Share a fun food fact about your specialty","Post a time-lapse of cooking your best dish","Ask followers to tag someone who loves food"],
    "Business & Finance":["Share one business tip that changed your life 💡","Post a client success story with results","Show your workspace and daily routine","Share a common money mistake to avoid","Post a motivational quote with your story","Ask: what is your biggest business challenge?","Share 3 free tools that grew your business","Post your journey from day 1 to today","Share a lesson you learned the hard way","Give away a free resource or checklist"],
    "Technology":["Share a tech tip that saves time ⚡","Post a before/after of a problem you solved","Ask: Android or iPhone? Why?","Share the AI tool that changed your workflow","Post 5 free tech tools everyone should use","Show a coding trick in 60 seconds","Ask followers what tech topic to cover next","Share a tech prediction for next year","Post a common tech myth debunked","Give a free tutorial on a trending tool"],
    "Fitness & Health":["Share your morning routine 💪","Post a 30-second workout anyone can do","Ask: gym or home workout?","Share a healthy meal prep idea","Post your transformation story honestly","Give 3 tips for staying motivated","Share a common fitness myth debunked","Post a weekly challenge for followers","Ask followers their fitness goals","Share what you eat in a day"],
  };

  const DEFAULT_IDEAS = ["Ask your audience a yes or no question","Share a tip that took you years to learn","Post a before and after transformation","Go live and answer questions in real time","Share a funny relatable moment in your niche","Create a poll between two popular options","Share a customer or follower success story","Post a controversial opinion in your niche","Give something free — checklist, guide, tip","Share your biggest mistake and what you learned"];

  const BEST_TIMES = {
    "Monday":   [{time:"7:00 AM - 9:00 AM",score:85,label:"Morning commute"},{time:"12:00 PM - 1:00 PM",score:92,label:"Lunch break 🔥 Best"},{time:"6:00 PM - 8:00 PM",score:78,label:"Evening"}],
    "Tuesday":  [{time:"8:00 AM - 10:00 AM",score:80,label:"Morning"},{time:"1:00 PM - 2:00 PM",score:88,label:"After lunch"},{time:"7:00 PM - 9:00 PM",score:90,label:"Evening 🔥 Best"}],
    "Wednesday":[{time:"7:00 AM - 8:00 AM",score:75,label:"Early morning"},{time:"11:00 AM - 1:00 PM",score:95,label:"Midday 🔥 Best"},{time:"5:00 PM - 7:00 PM",score:85,label:"After work"}],
    "Thursday": [{time:"9:00 AM - 11:00 AM",score:82,label:"Morning"},{time:"1:00 PM - 3:00 PM",score:87,label:"Afternoon"},{time:"8:00 PM - 10:00 PM",score:91,label:"Night 🔥 Best"}],
    "Friday":   [{time:"7:00 AM - 9:00 AM",score:79,label:"Morning"},{time:"12:00 PM - 2:00 PM",score:89,label:"Lunch 🔥 Best"},{time:"4:00 PM - 6:00 PM",score:93,label:"End of work 🔥"}],
    "Saturday": [{time:"9:00 AM - 11:00 AM",score:91,label:"Weekend morning 🔥 Best"},{time:"1:00 PM - 3:00 PM",score:85,label:"Afternoon"},{time:"7:00 PM - 9:00 PM",score:88,label:"Night"}],
    "Sunday":   [{time:"10:00 AM - 12:00 PM",score:90,label:"Late morning 🔥 Best"},{time:"2:00 PM - 4:00 PM",score:82,label:"Afternoon"},{time:"8:00 PM - 10:00 PM",score:86,label:"Night"}],
  };

  const GROWTH_TIPS = [
    {icon:"⏰",title:"Post at Peak Times",tip:"Wednesday 11am-1pm and Friday 1-3pm get 3x more reach than random posting times."},
    {icon:"💬",title:"Reply Within 1 Hour",tip:"Facebook algorithm boosts posts that get comments quickly. Reply to every comment within 60 minutes."},
    {icon:"❓",title:"Ask Questions",tip:"Posts with questions get 100% more comments. End every post with a question to your audience."},
    {icon:"🎥",title:"Use Video Content",tip:"Facebook gives 5x more organic reach to video posts than image or text posts."},
    {icon:"📱",title:"Go Live Weekly",tip:"Facebook Live videos get 6x more interactions than regular videos. Go live every week."},
    {icon:"👥",title:"Join & Post in Groups",tip:"Post your content in relevant Facebook Groups. Groups have much higher organic reach than pages."},
    {icon:"🏷️",title:"Tag Relevant Pages",tip:"Tag other relevant pages in your posts. Their followers will see your content too."},
    {icon:"📅",title:"Post Consistently",tip:"Post 3-5 times per week at the same times. Consistency trains Facebook to show your content more."},
    {icon:"🎯",title:"Use 3-5 Hashtags",tip:"Facebook works best with 3-5 targeted hashtags. Too many looks like spam and reduces reach."},
    {icon:"📊",title:"Share Polls",tip:"Facebook polls get 4x more engagement than regular posts and boost your page score significantly."},
    {icon:"🤝",title:"Collaborate With Others",tip:"Do live sessions or tag collaborations with similar pages. Cross-promotion doubles your reach instantly."},
    {icon:"🖼️",title:"Use Bright Images",tip:"Posts with bright, high-contrast images get 180% more engagement than dark or blurry photos."},
  ];

  /* ── Components ── */
  function TopNav({setTab}){
    return(
      <div className="top-nav">
        <div style={{display:"flex",alignItems:"center",gap:8,fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,flex:1,letterSpacing:-0.5}}>
          <span style={{fontSize:24}}>🌱</span>
          <span style={{color:"#fff"}}>Organic</span>
          <span style={{color:"#00D97E"}}>Reach</span>
        </div>
        <div style={{background:"rgba(0,217,120,0.1)",border:"1px solid rgba(0,217,120,0.25)",borderRadius:8,padding:"4px 10px"}}>
          <span style={{color:"#00D97E",fontSize:11,fontFamily:"'JetBrains Mono',monospace",fontWeight:500}}>FREE TOOL</span>
        </div>
      </div>
    );
  }

  function BottomNav({tab,setTab}){
    const items=[
      {id:"home",  icon:"🏠", label:"Home"},
      {id:"time",  icon:"⏰", label:"Best Time"},
      {id:"hash",  icon:"🏷️", label:"Hashtags"},
      {id:"ideas", icon:"💡", label:"Ideas"},
      {id:"tips",  icon:"📈", label:"Tips"},
    ];
    return(
      <div className="bottom-nav">
        {items.map(it=>(
          <button key={it.id} onClick={()=>setTab(it.id)} className={tab===it.id?"active":""}>
            <span className="ni">{it.icon}</span>
            <span>{it.label}</span>
          </button>
        ))}
      </div>
    );
  }

  /* ── Home ── */
  function HomePage({setTab}){
    const tools=[
      {id:"time",  icon:"⏰", title:"Best Time to Post",    desc:"Find the perfect time to post for maximum reach",        color:"#00D97E"},
      {id:"hash",  icon:"🏷️", title:"Hashtag Generator",    desc:"Get viral hashtags for your niche instantly",            color:"#00B8FF"},
      {id:"ideas", icon:"💡", title:"Post Idea Generator",   desc:"Never run out of engaging content ideas",                color:"#FFD700"},
      {id:"engage",icon:"📊", title:"Engagement Calculator", desc:"Calculate and improve your engagement rate",             color:"#FF6B9D"},
      {id:"caption",icon:"✍️",title:"Caption Writer",        desc:"Write scroll-stopping captions with AI",                 color:"#BF5FFF"},
      {id:"tips",  icon:"📈", title:"Growth Tips",           desc:"12 proven tips to grow without paying Facebook",         color:"#FF6B35"},
    ];
    return(
      <div className="fade-up">
        {/* Hero */}
        <div className="card" style={{background:"linear-gradient(135deg,rgba(0,217,120,0.1),rgba(0,184,255,0.08))",borderColor:"rgba(0,217,120,0.3)",textAlign:"center",padding:"28px 20px"}}>
          <div style={{fontSize:48,marginBottom:12}}>🌱</div>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:26,color:"#fff",marginBottom:8}}>
            Organic<span style={{color:"#00D97E"}}>Reach</span>
          </div>
          <p style={{color:"#7ab893",fontSize:14,lineHeight:1.7,fontFamily:"'Outfit',sans-serif",marginBottom:16}}>
            Grow your Facebook page for FREE. No bots. No fake likes. Just smart strategies that actually work. 💪
          </p>
          <div style={{display:"flex",justifyContent:"center",gap:16,flexWrap:"wrap"}}>
            {[["100%","Free"],["12+","Growth Tips"],["7","Smart Tools"]].map(([v,l])=>(
              <div key={l} style={{textAlign:"center"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,color:"#00D97E"}}>{v}</div>
                <div style={{color:"#5a8a6a",fontSize:11,fontFamily:"'Outfit',sans-serif"}}>{l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Tools Grid */}
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:16,color:"#e0f0e8",marginBottom:12,paddingLeft:4}}>🛠️ Your Free Tools</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {tools.map(t=>(
            <div key={t.id} onClick={()=>setTab(t.id==="engage"?"engage":t.id==="caption"?"caption":t.id)} style={{background:"rgba(8,24,14,0.95)",border:`1px solid ${t.color}22`,borderRadius:16,padding:"16px 14px",cursor:"pointer",transition:"all 0.15s"}}
              onTouchStart={e=>e.currentTarget.style.borderColor=t.color+"66"}
              onTouchEnd={e=>e.currentTarget.style.borderColor=t.color+"22"}
            >
              <div style={{fontSize:28,marginBottom:8}}>{t.icon}</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:13,color:"#e0f0e8",marginBottom:4,lineHeight:1.3}}>{t.title}</div>
              <div style={{color:"#5a8a6a",fontSize:11,fontFamily:"'Outfit',sans-serif",lineHeight:1.4}}>{t.desc}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ── Best Time ── */
  function BestTimePage(){
    const [day,setDay]=useState("Wednesday");
    const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const times=BEST_TIMES[day];
    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">⏰ Best Time to Post</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Select a day to see the best times to post on Facebook for maximum organic reach.
          </p>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:20}}>
            {days.map(d=>(
              <button key={d} onClick={()=>setDay(d)} style={{background:day===d?"rgba(0,217,120,0.2)":"rgba(0,217,120,0.05)",border:`1px solid ${day===d?"#00D97E":"rgba(0,217,120,0.15)"}`,color:day===d?"#00D97E":"#5a8a6a",borderRadius:20,padding:"7px 14px",cursor:"pointer",fontSize:12,fontFamily:"'Outfit',sans-serif",fontWeight:day===d?600:400,transition:"all 0.15s"}}>

              </button>

          <div>
            {times.map((t,i)=>(
              <div key={i} className={`time-slot${t.score>=90?" best":""}`}>

                  <div style={{color:"#5a8a6a",fontSize:12,fontFamily:"'Outfit',sans-serif",marginTop:2}}>{t.label}</div>
                  <div className="score-bar-bg" style={{width:160,marginTop:6}}>
                    <div className="score-bar" style={{width:`${t.score}%`}}/>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:t.score>=90?"#00D97E":"#5a8a6a"}}>{t.score}%</div>
                  <div style={{color:"#3a6a4a",fontSize:10,fontFamily:"'JetBrains Mono',monospace"}}>reach score</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="section-title">📌 Pro Tips</div>
          {[
            "Post at the same time every day — consistency boosts reach",
            "Wednesday and Friday are the highest reach days overall",
            "Avoid posting between 10pm and 6am — lowest engagement",
            "Boost your best post after 2 hours if it gets good engagement",
          ].map((t,i)=>(
            <div key={i} className="tip-card">
              <div style={{color:"#b0d8c0",fontSize:13,fontFamily:"'Outfit',sans-serif",lineHeight:1.6}}>{t}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ── Hashtag Generator ── */
  function HashtagPage(){
    const [niche,setNiche]=useState("");
    const [custom,setCustom]=useState("");
    const [tags,setTags]=useState([]);
    const [copied,setCopied]=useState(false);

    function generate(){
      const list = HASHTAGS[niche] || DEFAULT_HASHTAGS;
      const shuffled = [...list].sort(()=>Math.random()-0.5).slice(0,12);
      if(custom.trim()){
        const extra = custom.trim().split(/[\s,]+/).map(t=>t.startsWith("#")?t:"#"+t).slice(0,3);
        setTags([...extra,...shuffled].slice(0,15));
      } else {
        setTags(shuffled);
      }
      setCopied(false);
    }

    function copyAll(){
      navigator.clipboard?.writeText(tags.join(" ")).catch(()=>{});
      setCopied(true);
      setTimeout(()=>setCopied(false),2000);
    }

    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">🏷️ Hashtag Generator</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Get 15 powerful hashtags for your niche to boost organic reach on Facebook.
          </p>
          <div style={{marginBottom:12}}>
            <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:6,display:"block"}}>Select your niche</label>
            <select className="input-field" value={niche} onChange={e=>setNiche(e.target.value)}>
              <option value="">-- Choose your niche --</option>
              {NICHES.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:6,display:"block"}}>Your keywords (optional)</label>
            <input className="input-field" value={custom} onChange={e=>setCustom(e.target.value)} placeholder="e.g. lagos food pizza delivery"/>
          </div>
          <button className="btn-primary" onClick={generate} disabled={!niche}>Generate Hashtags 🏷️</button>
        </div>

        {tags.length>0&&(
          <div className="card fade-up">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15,color:"#e0f0e8"}}>✅ Your {tags.length} Hashtags</div>
              <button onClick={copyAll} style={{background:copied?"rgba(0,217,120,0.2)":"transparent",border:"1px solid rgba(0,217,120,0.3)",color:"#00D97E",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontFamily:"'Outfit',sans-serif",fontWeight:600}}>
                {copied?"✅ Copied!":"📋 Copy All"}
              </button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {tags.map((t,i)=><span key={i} className="tag">{t}</span>)}
            </div>
            <div className="result-box" style={{marginTop:14}}>
              <div style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",lineHeight:1.7}}>
                💡 <strong style={{color:"#00D97E"}}>How to use:</strong> Copy all hashtags and paste them in your Facebook post caption. Use 3-5 for best results. Avoid using the same hashtags every day — rotate them!
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ── Post Ideas ── */
  function IdeasPage(){
    const [niche,setNiche]=useState("");
    const [ideas,setIdeas]=useState([]);
    const [saved,setSaved]=useState([]);

    function generate(){
      const list = POST_IDEAS[niche] || DEFAULT_IDEAS;
      const shuffled = [...list].sort(()=>Math.random()-0.5).slice(0,6);
      setIdeas(shuffled);
    }

    function saveIdea(idea){
      if(!saved.includes(idea)) setSaved([...saved,idea]);
    }

    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">💡 Post Idea Generator</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Never run out of content ideas. Get proven post ideas that get high engagement.
          </p>
          <div style={{marginBottom:14}}>
            <select className="input-field" value={niche} onChange={e=>setNiche(e.target.value)}>
              <option value="">-- Choose your niche --</option>
              {NICHES.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <button className="btn-primary" onClick={generate} disabled={!niche}>Generate Ideas 💡</button>
        </div>

        {ideas.length>0&&(
          <div className="card fade-up">
            <div className="section-title">✨ Post Ideas for You</div>
            {ideas.map((idea,i)=>(
              <div key={i} style={{background:"rgba(0,217,120,0.05)",border:"1px solid rgba(0,217,120,0.12)",borderRadius:12,padding:"14px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                <div style={{color:"#d0f0e0",fontSize:14,fontFamily:"'Outfit',sans-serif",lineHeight:1.6,flex:1}}>{idea}</div>
                <button onClick={()=>saveIdea(idea)} style={{background:saved.includes(idea)?"rgba(0,217,120,0.2)":"transparent",border:"1px solid rgba(0,217,120,0.2)",borderRadius:8,padding:"5px 10px",cursor:"pointer",color:"#00D97E",fontSize:13,flexShrink:0}}>
                  {saved.includes(idea)?"✅":"🔖"}
                </button>
              </div>
            ))}
            <button className="btn-primary" onClick={generate} style={{marginTop:6}}>Generate More 🔄</button>
          </div>
        )}

        {saved.length>0&&(
          <div className="card fade-up">
            <div className="section-title">🔖 Saved Ideas ({saved.length})</div>
            {saved.map((idea,i)=>(
              <div key={i} className="tip-card">
                <div style={{color:"#b0d8c0",fontSize:13,fontFamily:"'Outfit',sans-serif",lineHeight:1.6}}>{idea}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ── Engagement Calculator ── */
  function EngagePage(){
    const [followers,setFollowers]=useState("");
    const [likes,setLikes]=useState("");
    const [comments,setComments]=useState("");
    const [shares,setShares]=useState("");
    const [result,setResult]=useState(null);

    function calculate(){
      const f=parseFloat(followers)||0;
      const total=(parseFloat(likes)||0)+(parseFloat(comments)||0)*2+(parseFloat(shares)||0)*3;
      if(f===0) return;
      const rate=((total/f)*100).toFixed(2);
      let grade,color,advice;
      if(rate>=6){grade="🏆 Excellent";color="#00D97E";advice="Your engagement is outstanding! Keep posting consistently at peak times.";}
      else if(rate>=3){grade="✅ Good";color="#00B8FF";advice="Good engagement! Focus on asking more questions and going live weekly.";}
      else if(rate>=1){grade="⚠️ Average";color="#FFD700";advice="Average engagement. Try posting videos and polls to boost interaction.";}
      else{grade="❌ Low";color="#FF6B35";advice="Low engagement. Post more consistently, use hashtags, and reply to all comments.";}
      setResult({rate,grade,color,advice});
    }

    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">📊 Engagement Calculator</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Check your Facebook post engagement rate and get tips to improve it.
          </p>
          {[
            {label:"Page Followers",val:followers,set:setFollowers,ph:"e.g. 5000"},
            {label:"Post Likes",val:likes,set:setLikes,ph:"e.g. 120"},
            {label:"Post Comments",val:comments,set:setComments,ph:"e.g. 45"},
            {label:"Post Shares",val:shares,set:setShares,ph:"e.g. 20"},
          ].map(f=>(
            <div key={f.label} style={{marginBottom:12}}>
              <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:5,display:"block"}}>{f.label}</label>
              <input type="number" className="input-field" value={f.val} onChange={e=>f.set(e.target.value)} placeholder={f.ph}/>
            </div>
          ))}
          <button className="btn-primary" onClick={calculate} disabled={!followers}>Calculate Rate 📊</button>
        </div>

        {result&&(
          <div className="card fade-up">
            <div style={{textAlign:"center",padding:"10px 0 20px"}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:48,color:result.color}}>{result.rate}%</div>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:18,color:result.color,marginTop:4}}>{result.grade}</div>
              <div style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginTop:8}}>Engagement Rate</div>
            </div>
            <div className="result-box">
              <div style={{color:"#b0d8c0",fontSize:14,fontFamily:"'Outfit',sans-serif",lineHeight:1.7}}>{result.advice}</div>
            </div>
            <div style={{marginTop:14}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:600,fontSize:13,color:"#7ab893",marginBottom:8}}>INDUSTRY BENCHMARKS</div>
              {[["Below 1%","Low — needs improvement","#FF6B35"],["1% — 3%","Average for most pages","#FFD700"],["3% — 6%","Good engagement","#00B8FF"],["Above 6%","Excellent — top 10%","#00D97E"]].map(([r,l,c])=>(
                <div key={r} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid rgba(0,217,120,0.06)"}}>
                  <span style={{color:c,fontFamily:"'JetBrains Mono',monospace",fontSize:12,fontWeight:500}}>{r}</span>
                  <span style={{color:"#5a8a6a",fontSize:12,fontFamily:"'Outfit',sans-serif"}}>{l}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ── Caption Writer ── */
  function CaptionPage(){
    const [topic,setTopic]=useState("");
    const [tone,setTone]=useState("engaging");
    const [niche,setNiche]=useState("");
    const [loading,setLoading]=useState(false);
    const [caption,setCaption]=useState("");
    const [copied,setCopied]=useState(false);

    async function generate(){
      if(!topic.trim()) return;
      setLoading(true);
      setCaption("");
      try{
        const res = await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            model:"claude-sonnet-4-20250514",
            max_tokens:400,
            messages:[{role:"user",content:`Write a ${tone} Facebook post caption about: "${topic}" for a ${niche||"general"} page. Make it engaging, conversational and end with a question to boost comments. Include 1-2 relevant emojis. Keep it under 150 words. Only write the caption, nothing else.`}]
          })
        });
        const data = await res.json();
        const text = data.content?.find(b=>b.type==="text")?.text||"";
        setCaption(text);
      } catch(e){
        setCaption("Could not generate caption. Please check your connection and try again.");
      }
      setLoading(false);
    }

    function copy(){
      navigator.clipboard?.writeText(caption).catch(()=>{});
      setCopied(true);
      setTimeout(()=>setCopied(false),2000);
    }

    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">✍️ AI Caption Writer</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Write scroll-stopping Facebook captions that get comments and shares using AI.
          </p>
          <div style={{marginBottom:12}}>
            <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:5,display:"block"}}>What is your post about?</label>
            <textarea className="input-field" value={topic} onChange={e=>setTopic(e.target.value)} placeholder="e.g. new product launch, motivational tip, food recipe..." rows={3} style={{resize:"none"}}/>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:5,display:"block"}}>Your niche (optional)</label>
            <select className="input-field" value={niche} onChange={e=>setNiche(e.target.value)}>
              <option value="">-- Select niche --</option>
              {NICHES.map(n=><option key={n} value={n}>{n}</option>)}
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{color:"#7ab893",fontSize:12,fontFamily:"'Outfit',sans-serif",marginBottom:8,display:"block"}}>Caption tone</label>
            <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              {["engaging","funny","inspiring","professional","casual"].map(t=>(
                <button key={t} onClick={()=>setTone(t)} style={{background:tone===t?"rgba(0,217,120,0.2)":"rgba(0,217,120,0.04)",border:`1px solid ${tone===t?"#00D97E":"rgba(0,217,120,0.15)"}`,color:tone===t?"#00D97E":"#5a8a6a",borderRadius:20,padding:"6px 14px",cursor:"pointer",fontSize:12,fontFamily:"'Outfit',sans-serif",fontWeight:tone===t?600:400,textTransform:"capitalize"}}>
                  {t}
                </button>
              ))}
            </div>
          </div>
          <button className="btn-primary" onClick={generate} disabled={!topic.trim()||loading}>
            {loading?<span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}><span className="spinner"/>Generating...</span>:"Generate Caption ✍️"}
          </button>
        </div>

        {caption&&(
          <div className="card fade-up">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15,color:"#e0f0e8"}}>✅ Your Caption</div>
              <button onClick={copy} style={{background:copied?"rgba(0,217,120,0.2)":"transparent",border:"1px solid rgba(0,217,120,0.3)",color:"#00D97E",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontFamily:"'Outfit',sans-serif",fontWeight:600}}>
                {copied?"✅ Copied!":"📋 Copy"}
              </button>
            </div>
            <div style={{background:"rgba(0,217,120,0.04)",border:"1px solid rgba(0,217,120,0.12)",borderRadius:12,padding:"16px",color:"#d0f0e0",fontSize:15,fontFamily:"'Outfit',sans-serif",lineHeight:1.8,whiteSpace:"pre-wrap"}}>
              {caption}
            </div>
            <button className="btn-primary" onClick={generate} style={{marginTop:12}}>Generate Another 🔄</button>
          </div>
        )}
      </div>
    );
  }

  /* ── Growth Tips ── */
  function TipsPage(){
    const [expanded,setExpanded]=useState(null);
    return(
      <div className="fade-up">
        <div className="card">
          <div className="section-title">📈 12 Free Growth Tips</div>
          <p style={{color:"#7ab893",fontSize:13,fontFamily:"'Outfit',sans-serif",marginBottom:16,lineHeight:1.6}}>
            Proven strategies to grow your Facebook page organically — completely free, no ads needed.
          </p>
          {GROWTH_TIPS.map((t,i)=>(
            <div key={i} onClick={()=>setExpanded(expanded===i?null:i)} style={{background:expanded===i?"rgba(0,217,120,0.08)":"rgba(0,217,120,0.03)",border:`1px solid ${expanded===i?"rgba(0,217,120,0.3)":"rgba(0,217,120,0.1)"}`,borderRadius:12,padding:"14px",marginBottom:8,cursor:"pointer",transition:"all 0.2s"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:22,flexShrink:0}}>{t.icon}</span>
                  <span style={{fontFamily:"'Syne',sans-serif",fontWeight:600,fontSize:14,color:"#e0f0e8"}}>{t.title}</span>
                </div>
                <span style={{color:"#3a6a4a",fontSize:18,flexShrink:0}}>{expanded===i?"▲":"▼"}</span>
              </div>
              {expanded===i&&(
                <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid rgba(0,217,120,0.12)",color:"#b0d8c0",fontSize:14,fontFamily:"'Outfit',sans-serif",lineHeight:1.7}}>
                  {t.tip}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ── App ── */
  function App(){
    const [tab,setTab]=useState("home");
    const renderPage=()=>{
      switch(tab){
        case "home":    return <HomePage setTab={setTab}/>;
        case "time":    return <BestTimePage/>;
        case "hash":    return <HashtagPage/>;
        case "ideas":   return <IdeasPage/>;
        case "engage":  return <EngagePage/>;
        case "caption": return <CaptionPage/>;
        case "tips":    return <TipsPage/>;
        default:        return <HomePage setTab={setTab}/>;
      }
    };
    return(
      <div style={{minHeight:"100vh",background:"#030D07"}}>
        <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:0,backgroundImage:`radial-gradient(ellipse at 20% 30%,rgba(0,217,120,0.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(0,184,255,0.03) 0%,transparent 50%)`}}/>
        <TopNav setTab={setTab}/>
        <div className="page" style={{position:"relative",zIndex:1}}>{renderPage()}</div>
        <BottomNav tab={tab} setTab={setTab}/>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
